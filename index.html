<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centros</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css?v=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly-cartesian.min.js"></script>
</head>
<body>
  <header>
    <div class="contenido">
      <!-- Los botones se crean desde centros.json -->
      <nav id="centros" aria-label="Centros"></nav>
    </div>
  </header>

  <main class="contenido">
    <p id="mensaje" role="status">Cargando datos…</p>

    <div id="panel" hidden>
      <div class="encabezado-centro">
        <div>
          <h2 id="nombre-centro"></h2>
          <p id="ultima-medicion"></p>
        </div>
        <div id="promedios" role="group" aria-label="Tipo de datos">
          <button type="button" data-promedio="original">Datos originales</button>
          <button type="button" data-promedio="hora">Promedios horarios</button>
          <button type="button" data-promedio="dia">Promedios diarios</button>
        </div>
      </div>

      <div id="fechas">
        <label>Desde <input type="date" id="desde"></label>
        <label>Hasta <input type="date" id="hasta"></label>
        <button type="button" id="todo">Todas las fechas</button>
      </div>
      <p id="sin-datos" role="status" hidden>No hay datos en esas fechas.</p>

      <section id="tarjetas" aria-label="Últimos valores"></section>
      <section id="graficos" aria-label="Series de tiempo"></section>

    </div>
  </main>

  <script src="app.js?v=1"></script>
</body>
</html>
