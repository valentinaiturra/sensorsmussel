<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensors Mussel</title>
  <style>
    /* Colores principales de la página */
    :root {
      --azul: #0e3b52;
      --celeste: #dff0f5;
      --blanco: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--azul);
      background: var(--celeste);
    }

    /* Texto centrado en la pantalla */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      font-size: 1.2rem;
    }

    /* Olas decorativas al pie */
    .olas {
      display: block;
      width: 100%;
      height: 22vh;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sensors Mussel</h1>
    <p>Página de prueba: sitio en construcción</p>
  </main>

  <svg class="olas" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#7fb9cc" d="M0 70 C200 10 400 130 600 70 S1000 10 1200 70 V200 H0 Z"/>
    <path fill="#2f7a96" d="M0 110 C200 60 400 160 600 110 S1000 60 1200 110 V200 H0 Z"/>
    <path fill="#0e3b52" d="M0 150 C200 110 400 190 600 150 S1000 110 1200 150 V200 H0 Z"/>
  </svg>
</body>
</html>
